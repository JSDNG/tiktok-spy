# Reverse proxy: tiktokspy.supover.com -> tiktok-spy `app` container (127.0.0.1:8010)
#
# Cài trên server:
#   sudo cp deploy/nginx/tiktokspy.supover.com.conf /etc/nginx/sites-available/tiktokspy.supover.com
#   sudo ln -s /etc/nginx/sites-available/tiktokspy.supover.com /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d tiktokspy.supover.com   # cấp SSL, certbot sẽ tự sửa block 443 bên dưới

server {
    listen 80;
    listen [::]:80;
    server_name tiktokspy.supover.com;

    location / {
        proxy_pass http://127.0.0.1:8010;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
